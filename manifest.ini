name = pomodoro
summary = "Pomodoro Timer"
description = """A Pomodoro Technique timer for NVDA users.
Default cycle: 25 minutes of focused work, 5 minute short break, with a longer 15 minute break after every 4 work sessions.
Phase transitions are announced through speech and short tones.
Gestures (all rebindable in Input Gestures, category 'Pomodoro Timer'):
NVDA+Alt+P  start, pause or resume the timer.
NVDA+Alt+S  stop and reset the timer.
NVDA+Alt+T  speak the current phase, time remaining, and completed session count.
NVDA+Alt+K  skip to the next phase.
NVDA+Alt+R  reset the completed session counter.
Open NVDA menu, Preferences, Settings, Pomodoro Timer to change durations and other options."""
author = "Thomas <taljazz@me.com>"
url = https://github.com/taljazz/nvda-pomodoro
version = 1.1.2
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.1
updateChannel = None
